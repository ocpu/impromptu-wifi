# Compile check for the ESP32 backend (impromptu-wifi features `esp` and
# `embassy-trouble`), the way a firmware crate depends on it. Not published and not
# a workspace member: it selects a chip, which a library crate must not do.
[package]
name = "esp32c6-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
impromptu-wifi = { path = "../../crates/impromptu-wifi", features = ["esp", "embassy-trouble"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "unstable"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6"] }
