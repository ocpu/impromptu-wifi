# ESP32-S3 firmware that offers Improv Wi-Fi over USB serial and Bluetooth LE
# at the same time. Not a workspace member: it selects a chip, which a
# library crate must not do. CI builds it.
[package]
name = "impromptu-wifi-esp32s3"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
impromptu-wifi = { path = "../../crates/impromptu-wifi", features = ["esp", "embassy-trouble", "embassy-flash"] }

esp-hal = { version = "1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["ble", "coex", "esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }
# Logs go to UART0 so USB-Serial-JTAG carries only Improv Wi-Fi frames.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "uart", "critical-section"] }
log = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp"] }
embedded-io-async = "0.7.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
bt-hci = "0.9.0"
trouble-host = { version = "0.7.0", default-features = false, features = ["gatt", "derive", "default-packet-pool"] }
static_cell = "2.1.1"

[profile.dev]
# The unoptimised build is too slow and too large for the chip.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
