[package]
name = "impromptu-wifi-embassy"
description = "Improv Wi-Fi glue for embassy-based firmware: button authorization and trouble-host BLE bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.91" # embassy-net (smoltcp 0.13)
categories = ["embedded", "no-std", "network-programming"]
keywords = ["improv", "wifi", "provisioning", "embassy", "ble"]

[features]
## Device side over trouble-host: the Improv GATT service and a GattServer.
trouble = ["dep:trouble-host", "dep:static_cell", "trouble-host/peripheral"]
## Client side over trouble-host: a GattClient for provisioning other devices.
trouble-central = ["dep:trouble-host", "trouble-host/central"]
## Serial over USB CDC-ACM with embassy-usb.
usb = ["dep:embassy-usb", "dep:embedded-io-async"]
## Redirect URLs and connectivity from an embassy-net stack.
embassy-net = ["dep:embassy-net"]
## ESP32 Wi-Fi backend over esp-radio. Enable your chip's esp-radio feature
## (for example `esp-radio/esp32c6`) and a global allocator in the application.
esp = ["dep:esp-radio", "esp-radio/wifi", "esp-radio/unstable", "embassy-net"]
defmt = ["impromptu-wifi-core/defmt", "impromptu-wifi-ble/defmt", "embassy-time/defmt"]

[dependencies]
impromptu-wifi-core.workspace = true
impromptu-wifi-client.workspace = true
impromptu-wifi-serial.workspace = true
impromptu-wifi-ble.workspace = true
heapless.workspace = true
embassy-futures.workspace = true
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embedded-hal-async = "1.0.0"
embedded-io-async = { workspace = true, optional = true }
embassy-usb = { version = "0.6.0", optional = true, default-features = false }
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = ["proto-ipv4", "medium-ethernet", "dhcpv4"] }
# Beta, pinned exactly: esp-radio 1.0 is the line that pairs with esp-hal 1.2.
esp-radio = { version = "=1.0.0-beta.1", optional = true, default-features = false }
# The gatt_service macro expands to code that uses static_cell.
static_cell = { version = "2.1.1", optional = true }
trouble-host = { version = "0.8.0", optional = true, default-features = false, features = ["gatt", "derive", "default-packet-pool"] }

[dev-dependencies]
# A real clock on the host, for the authorization timing tests.
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
embedded-hal = "1.0.0"

[[test]]
name = "usb_zlp"
required-features = ["usb"]
