# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false
# The ESP32 backend needs a chip feature that only a firmware crate selects;
# the examples/esp32c6 firmware covers it.
features = [
    "impromptu-wifi-embassy/trouble",
    "impromptu-wifi-embassy/trouble-central",
    "impromptu-wifi-embassy/usb",
    "impromptu-wifi-embassy/embassy-net",
    "impromptu-wifi-linux/daemon",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # zbus 5 depends on these; zbus 6 merges them into itself. Remove these
    # entries when impromptu-wifi-linux moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via zbus 5; fixed by moving to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via zbus 5; fixed by moving to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via zbus 5; fixed by moving to zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",   # unicode-ident
    "0BSD",          # managed, smoltcp
    "MPL-2.0",       # serialport (file-level copyleft; used unmodified)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
