name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new RustSec advisories show up without a code change.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned so new clippy lints arrive through a reviewed change, not a
  # random red build. Bump together with fixes for any new warnings.
  RUST_STABLE: "1.99.1"
  # Host-buildable features. `esp` needs a chip feature and is
  # covered by the esp32s3 example job; `defmt` by the no_std jobs.
  HOST_FEATURES: >-
    impromptu-wifi-embassy/trouble,impromptu-wifi-embassy/trouble-central,impromptu-wifi-embassy/usb,impromptu-wifi-embassy/embassy-net,impromptu-wifi-embassy/flash,impromptu-wifi-linux/daemon,impromptu-wifi/embassy-trouble,impromptu-wifi/embassy-trouble-central,impromptu-wifi/embassy-usb,impromptu-wifi/embassy-net,impromptu-wifi/embassy-flash,impromptu-wifi/host-serial,impromptu-wifi/host-ble,impromptu-wifi/linux-networkmanager,impromptu-wifi/linux-hostnamed,impromptu-wifi/linux-serial,impromptu-wifi/linux-bluez
  # The crates that claim `no_std` without impromptu-wifi-embassy. The
  # facade, impromptu-wifi, builds here with no features.
  NO_STD_CRATES: >-
    -p impromptu-wifi -p impromptu-wifi-proto -p impromptu-wifi-traits -p impromptu-wifi-core -p impromptu-wifi-client -p impromptu-wifi-serial -p impromptu-wifi-ble

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --features "$HOST_FEATURES" -- -D warnings
      - name: clippy (default features only)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dbus-daemon is preinstalled on the runner; the D-Bus tests in
      # impromptu-wifi-linux and impromptu-wifi-host start a private instance.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace --features "$HOST_FEATURES"
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --features "$HOST_FEATURES"

  other-os:
    # The host BLE client uses btleplug instead of BlueZ on these systems.
    name: host crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p impromptu-wifi-host -p impromptu-wifi-cli --all-targets -- -D warnings

  web:
    name: Web client (wasm32)
    runs-on: ubuntu-24.04
    env:
      # web-sys exposes Web Serial and Web Bluetooth only with this cfg.
      RUSTFLAGS: --cfg=web_sys_unstable_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p impromptu-wifi-web --target wasm32-unknown-unknown -- -D warnings

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cortex-M0/M0+ (RP2040). No atomic compare-and-swap, which
          # static_cell (through trouble-host) needs.
          - target: thumbv6m-none-eabi
            embassy_features: usb,embassy-net,flash,defmt
            facade_features: serial,ble,embassy-usb,embassy-net,embassy-flash,defmt
          # Cortex-M4F/M7F (nRF52, STM32F4).
          - target: thumbv7em-none-eabihf
            embassy_features: trouble,trouble-central,usb,embassy-net,flash,defmt
            facade_features: serial,ble,embassy-trouble,embassy-trouble-central,embassy-usb,embassy-net,embassy-flash,defmt
          # ESP32-C3/C6 and other RV32IMAC chips.
          - target: riscv32imac-unknown-none-elf
            embassy_features: trouble,trouble-central,usb,embassy-net,flash,defmt
            facade_features: serial,ble,embassy-trouble,embassy-trouble-central,embassy-usb,embassy-net,embassy-flash,defmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: core crates
        run: cargo build --locked $NO_STD_CRATES --target ${{ matrix.target }}
      - name: core crates with defmt
        run: cargo build --locked $NO_STD_CRATES --features impromptu-wifi-ble/defmt,impromptu-wifi-serial/defmt --target ${{ matrix.target }}
      - name: impromptu-wifi-embassy
        run: cargo build --locked -p impromptu-wifi-embassy --features ${{ matrix.embassy_features }} --target ${{ matrix.target }}
      - name: impromptu-wifi (facade)
        run: cargo build --locked -p impromptu-wifi --features ${{ matrix.facade_features }} --target ${{ matrix.target }}

  esp32s3:
    # Builds and links the example firmware: the ESP32 backend, the
    # trouble-host bindings and esp-radio's BLE controller together, on
    # Xtensa, which needs Espressif's Rust fork.
    name: ESP32-S3 example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32s3
          # Pinned for the same reason as RUST_STABLE.
          version: "1.97.0.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/esp32s3
      - working-directory: examples/esp32s3
        run: cargo fmt --check
      - working-directory: examples/esp32s3
        run: cargo clippy --locked --release -- -D warnings
      - working-directory: examples/esp32s3
        run: cargo build --locked --release

  raspberry-pi:
    # Static builds of impromptu-wifi-device for examples/raspberry-pi,
    # linked with rustup's rust-lld (see .cargo/config.toml).
    name: Raspberry Pi (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabihf
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p impromptu-wifi-linux --features daemon --bin impromptu-wifi-device --target ${{ matrix.target }}
      - name: shell syntax
        run: sh -n examples/raspberry-pi/setup.sh

  msrv:
    name: MSRV (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workspace rust-version, set by heapless 0.9.
          - rust: "1.87"
            args: >-
              -p impromptu-wifi -p impromptu-wifi-proto -p impromptu-wifi-traits -p impromptu-wifi-core -p impromptu-wifi-client -p impromptu-wifi-serial -p impromptu-wifi-ble
              --features impromptu-wifi/serial,impromptu-wifi/ble
          # impromptu-wifi-embassy (smoltcp 0.13) and the host crates.
          - rust: "1.91"
            args: >-
              -p impromptu-wifi -p impromptu-wifi-embassy -p impromptu-wifi-host -p impromptu-wifi-cli -p impromptu-wifi-linux -p impromptu-wifi-web
              --features impromptu-wifi-embassy/trouble,impromptu-wifi-embassy/trouble-central,impromptu-wifi-embassy/usb,impromptu-wifi-embassy/embassy-net,impromptu-wifi-embassy/flash,impromptu-wifi-linux/daemon,impromptu-wifi/embassy-trouble,impromptu-wifi/embassy-trouble-central,impromptu-wifi/embassy-usb,impromptu-wifi/embassy-net,impromptu-wifi/embassy-flash,impromptu-wifi/host-serial,impromptu-wifi/host-ble,impromptu-wifi/linux-networkmanager,impromptu-wifi/linux-hostnamed,impromptu-wifi/linux-serial,impromptu-wifi/linux-bluez
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets ${{ matrix.args }}

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
          arguments: --locked

  dependency-age:
    # Ages only grow, so the scheduled run adds nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I scripts/check-dep-age.py --min-days 14 Cargo.lock examples/esp32s3/Cargo.lock
