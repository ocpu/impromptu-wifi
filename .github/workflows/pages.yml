name: Pages

# Builds the project site (landing page, browser client, documentation) on
# every push and pull request; deploys it to GitHub Pages from main only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_STABLE: "1.99.1"
  # Must match the wasm-bindgen crate in Cargo.lock.
  WASM_BINDGEN_VERSION: "0.2.129"
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-bindgen-cli and mdBook
        run: |
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          cargo install --locked mdbook --version "$MDBOOK_VERSION"
      - name: Test the documentation staging
        run: python3 -I scripts/test_stage_docs.py
      - name: Build the site
        run: scripts/build-site.sh target/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
